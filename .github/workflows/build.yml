name: build
on:
  push:
    branches: [master]
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Conan
        run: pip install conan
      - name: Generate project files
        run: python automation/generate_project_files.py
      - name: Build Debug
        run: python automation/build_debug.py
      - name: Build Release
        run: python automation/build_release.py
      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: app
          path: |
            build/bin/Release/App.exe
            config.json
