name: tests
on:
  push:
    branches: [master]
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Conan
        run: pip install conan
      - name: Cache Conan packages
        uses: actions/cache@v6
        with:
          path: ~/.conan2/p
          key: conan-${{ runner.os }}-${{ hashFiles('conanfile.txt', 'profiles/**') }}
      - name: Generate project files
        run: python automation/generate_project_files.py
      - name: Tests under AddressSanitizer
        run: python automation/run_asan.py
      - name: Run tests
        run: python automation/run_tests.py
      - name: Install OpenCppCoverage
        run: choco install opencppcoverage -y --no-progress
      - name: Measure coverage
        run: python automation/run_coverage.py --min 70
      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-report
          path: build/coverage/html
      - name: Upload test report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-report
          path: build/test-report.xml
      - name: Publish test report
        uses: phoenix-actions/test-reporting@v16  
        if: always()
        with:
          name: Test results
          path: build/test-report.xml
          reporter: java-junit
          output-to: step-summary
          fail-on-error: true
